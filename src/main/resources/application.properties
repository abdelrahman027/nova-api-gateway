
# =========================================================
# Load .env file (parsed as standard properties file)
# =========================================================
spring.config.import=optional:file:.env[.properties]
spring.application.name=${SPRING_APPLICATION_NAME:gateway-service}
server.port=${SERVER_PORT:8080}

logging.level.org.springframework.cloud.gateway=${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_CLOUD_GATEWAY:trace}

spring.security.user.name=${SPRING_SECURITY_USER_NAME:disabled}
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD:disabled}

# JWT Secret has no default fallback for security reasons
jwt.secret=${JWT_SECRET}